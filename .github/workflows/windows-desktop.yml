name: Windows desktop
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new version to GitHub Releases after successful checks
        type: boolean
        default: false
  push:
    branches: [main, 'preview/**']
    tags: ['desktop-v*']
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate release packaging scripts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem .github/scripts -Filter '*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Install interface dependencies
        run: npm install --ignore-scripts
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Windows installer and run tests
        working-directory: desktop
        run: |
          npm run build
          npx tsc --noEmit -p tsconfig.json
          npm test
          npx electron tests/protocol-smoke.electron.cjs
          npx electron tests/features-smoke.electron.cjs
          if (!(Test-Path test-output/features-smoke.json)) { throw 'UI smoke report missing' }
          $uiReport = Get-Content test-output/features-smoke.json -Raw | ConvertFrom-Json
          if (!$uiReport.ok) { throw ($uiReport.error) }
          Get-Content test-output/features-smoke.json
          npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
      - name: Prepare installer-only archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/installer-archive.ps1
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop version' }
          $tag = "desktop-v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match desktop version' }
          $out = Join-Path $env:RUNNER_TEMP 'atlas-release-assets'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $installers = @(Get-ChildItem desktop/release -Filter '*-Setup.exe' -File)
          $installerName = "AtlasMaster-$version-x64-Setup.exe"
          if ($installers.Count -ne 1 -or $installers[0].Name -ne $installerName) { throw 'Expected one matching Windows installer' }
          $archive = Join-Path $out "AtlasMaster-$version-Windows-x64-Setup.zip"
          $installerHash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash
          Compress-Archive -Path $installers[0].FullName -DestinationPath $archive -CompressionLevel Optimal
          Assert-InstallerArchive -Path $archive -InstallerName $installerName -ExpectedInstallerHash $installerHash | Format-List
          "ATLAS_RELEASE_ASSETS=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ATLAS_RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ATLAS_RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasMaster-Windows-x64
          path: ${{ env.ATLAS_RELEASE_ASSETS }}/*
          retention-days: 30
      - name: Publish release and migrate first-release downloads
        if: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && (github.event_name == 'push' || inputs.publish) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/publish-release.ps1
